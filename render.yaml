# Static site for the Vite + React Router app.
# Apply this Blueprint from the prod branch. Vite inlines VITE_* at build time,
# so set them in the Render Dashboard before the first build. Do not commit values.
# VITE_API_BASE_PATH is required (the deployed API origin). The other VITE_* keys
# are optional and can be left empty.
services:
  - type: web
    name: client-mvp
    runtime: static
    branch: prod
    # Render sets NODE_ENV=production, which skips devDependencies. Vite is one.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HUSKY
        value: '0'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: VITE_API_BASE_PATH
        sync: false
      - key: VITE_GMAIL_CLIENT_ID
        sync: false
      - key: VITE_APP_IMG_URL
        sync: false
      - key: VITE_APP_IMG_USER_URL
        sync: false
      - key: VITE_APP_TINY_MCE_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
